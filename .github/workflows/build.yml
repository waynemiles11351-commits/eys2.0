name: Build GGD Identity Overlay v3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build arm64 iOS dylib
        shell: bash
        run: |
          set -euo pipefail
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          CLANG="$(xcrun --sdk iphoneos -f clang++)"
          OUT="$GITHUB_WORKSPACE/dist"
          mkdir -p "$OUT"
          "$CLANG" \
            -arch arm64 \
            -isysroot "$SDKROOT" \
            -miphoneos-version-min=18.0 \
            -std=c++17 \
            -fobjc-arc \
            -fobjc-exceptions \
            -fPIC \
            -dynamiclib \
            -O2 \
            -Wl,-no_implicit_dylibs \
            -Wl,-install_name,@rpath/GGDIdentityOverlay.dylib \
            -framework Foundation \
            -framework UIKit \
            -framework QuartzCore \
            GGDFinal.mm \
            -o "$OUT/GGDIdentityOverlay.dylib"
          file "$OUT/GGDIdentityOverlay.dylib"
          xcrun --sdk iphoneos otool -hv "$OUT/GGDIdentityOverlay.dylib"
          xcrun --sdk iphoneos otool -L "$OUT/GGDIdentityOverlay.dylib"
          ls -lh "$OUT/GGDIdentityOverlay.dylib"

      - name: Package artifact
        uses: actions/upload-artifact@v4
        with:
          name: GGDIdentityOverlay-v3-arm64
          path: dist/GGDIdentityOverlay.dylib
